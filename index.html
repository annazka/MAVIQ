<!doctype html>
<html lang="id" data-type="software">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem('maviq-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      :root { color-scheme: light dark; background: light-dark(#fafaf7, #020817); }
      :root[data-theme="light"] { color-scheme: only light; }
      :root[data-theme="dark"] { color-scheme: only dark; }
    </style>
    <meta name="description" content="MAVIQ membantu pemilik usaha kuliner mencatat penjualan, pembelian, stok, dan arus kas dalam satu tempat." />
    <link rel="icon" type="image/svg+xml" href="/maviq.svg" />
    <title>MAVIQ — Operasional Usaha</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
